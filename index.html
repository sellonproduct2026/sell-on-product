<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell On Product</title><link rel="stylesheet" href="style.css"></head><body>
<header><h2>SELL ON <b>PRODUCT</b></h2><button id="lang">English</button><button id="cartBtn">🛒 Cart <span id="count">0</span></button></header>
<section class="hero"><h1>आपका फोन, आपका स्टाइल</h1><p>कंपनी चुनें → मॉडल चुनें → अपने फोन के कवर देखें</p><input id="search" placeholder="कंपनी या मॉडल खोजें..."></section>
<main><h2>मोबाइल कंपनी चुनें</h2><div id="brands" class="grid"></div><section id="models" hidden><h2 id="modelHeading">मॉडल चुनें</h2><button id="back">← कंपनी बदलें</button><div id="modelList" class="grid"></div></section><section id="covers" hidden><h2 id="coverHeading">Back Covers</h2><button id="backModel">← मॉडल बदलें</button><label class="filter-label">कवर का प्रकार चुनें: <select id="coverType"><option value="all">सभी प्रकार</option><option>Transparent Cover</option><option>Silicone Cover</option><option>Printed / Designer Cover</option><option>Magnetic / MagSafe Style Cover</option><option>Premium Protective Cover</option></select></label><div id="products" class="grid"></div></section></main>
<footer>© Sell On Product</footer><aside id="cart" hidden><button id="close">✕</button><h2>आपका कार्ट</h2><div id="cartItems"></div><h3 id="total">₹0</h3><button id="checkout">WhatsApp पर ऑर्डर करें</button><p>ऑर्डर चालू करने से पहले script.js में अपना WhatsApp नंबर डालें।</p></aside><script src="script.js"></script></body></html>
